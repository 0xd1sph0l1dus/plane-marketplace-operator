# This rule is not used by the project airbus-marketplace-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the marketplace.edge-ops.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: airbus-marketplace-operator
    app.kubernetes.io/managed-by: kustomize
  name: apprelease-editor-role
rules:
- apiGroups:
  - marketplace.edge-ops.dev
  resources:
  - appreleases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - marketplace.edge-ops.dev
  resources:
  - appreleases/status
  verbs:
  - get
