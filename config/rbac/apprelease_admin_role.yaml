# This rule is not used by the project airbus-marketplace-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over marketplace.edge-ops.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: airbus-marketplace-operator
    app.kubernetes.io/managed-by: kustomize
  name: apprelease-admin-role
rules:
- apiGroups:
  - marketplace.edge-ops.dev
  resources:
  - appreleases
  verbs:
  - '*'
- apiGroups:
  - marketplace.edge-ops.dev
  resources:
  - appreleases/status
  verbs:
  - get
